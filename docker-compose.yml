version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cyberwolf-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberwolf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-cyberwolf_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberwolf} -d ${POSTGRES_DB:-cyberwolf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberwolf-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cyberwolf}:${POSTGRES_PASSWORD:-development-only-postgres-password}@db:5432/${POSTGRES_DB:-cyberwolf_db}
      - SECRET_KEY=${SECRET_KEY:-development-only-placeholder-change-before-production}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberwolf-frontend
    restart: always
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
